version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: devtrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devtrack
      POSTGRES_PASSWORD: devtrack123
      POSTGRES_DB: devtrack_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - devtrack-network

  # Opcional: pgAdmin para gestión visual
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: devtrack-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@devtrack.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - devtrack-network

volumes:
  postgres_data:

networks:
  devtrack-network:
    driver: bridge
