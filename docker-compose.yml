services:
  postgres:
    image: postgres:15-alpine
    container_name: devtrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devtrack
      POSTGRES_PASSWORD: devtrack123
      POSTGRES_DB: devtrack_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devtrack-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: devtrack-server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://devtrack:devtrack123@postgres:5432/devtrack_db
      JWT_SECRET: devtrack_secret_key_2024
      JWT_REFRESH_SECRET: devtrack_refresh_secret_key_2024
      PORT: 3000
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - devtrack-network

volumes:
  postgres_data:
networks:
  devtrack-network:
    driver: bridge